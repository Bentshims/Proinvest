<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Tiroir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <script defer src="index.js"></script>
    <style>
        body {
            transition: background 0.3s ease-in-out;
        }

    </style>
</head>
<body class="bg-gray-500">

    <!-- Bouton Menu Burger -->
    <button id="menuButton" class="p-3 fixed top-4 left-4 bg-gray-800 text-white rounded">
        ☰
    </button>

    <!-- Menu Tiroir -->
    <div id="drawerMenu" class="fixed top-0 left-0 h-full w-1/2 bg-white shadow-lg transform transition-transform duration-300 p-6">
        <button id="closeButton" class="absolute top-4 right-4 text-xl">✖</button>
        
        <nav class="mt-10 space-y-4 text-lg">
            <a href="#" class="block hover:text-blue-600">Accueil</a>
            <a href="#" class="block hover:text-blue-600">Nos Programmes</a>
            <a href="#" class="block hover:text-blue-600">Contact</a>
        </nav>
    </div>

    <!-- <script src="script.js"></script> -->
</body>
</html>
