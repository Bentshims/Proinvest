<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="index.js"></script>
    <style>
        *{
            text-decoration: none;
            border: none;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            margin: 0;
            padding: 0;
            position: relative;
        }
        .burger{
            cursor: pointer;
            transition: 500ms ease;
            position: relative;
            z-index: 100;
        }
        .burger:hover{
            transform: scale(120%);
        }
        .burger div{
            width: 1.5rem;
            height: 0.3rem;
            background-color: #000000;
            margin: 5px 0;
        }
        .logo{
            width: 4rem;
            line-height: 4rem;
            background: #ebaf0b;
            border-radius: 50%;
            text-align: center;
            color: rgb(255, 255, 255);
        }
        header{
            background:#7299c5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 10px;

        }
        .overlay{
            position: absolute;
            top: 0;
            left: -100%;
            z-index: 20;
            width: 40%;
            height: 100vh;
            background: #073d1f;
            transition: 500ms ease;
            
        }
        .none{
            display: none;
        }
        .links{
            display: flex;
            flex-direction: column;
            padding: 2rem 1rem;
            gap: 2rem;
        }
        .links button{
            background:#7299c5;
            padding: 7px;
            border-radius: 5px;
            transition: 500ms ease;
        }
        .links button:hover{
            background: #264142;
            border: 2px solid #7299c5;
        }
        .close-Btn{
            background: #000;
            width: 2rem;
            line-height: 2rem;
            text-align: center;
            font-weight: bold;
            margin: 1.5rem 0.3rem;
            border-radius: 50%;
            cursor: pointer;
        }
        .overlay-bg{
            background: #000000;
            width: 100vw;
            height: 100vh;
            opacity: 0.4;
            position: fixed;
            top: 0;
            left: 0;
            transition: opacity 500ms ease;
        }
        .opacity{
            opacity: 0;
        }


    </style>
</head>
<body>
    <header>
        <div class="logo">
            logo
        </div>
        <div class="burger">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </header>
 
    <div class="overlay open">
        <div class="close-Btn scale-object">
            &times;
        </div>
        <div class="links">
            <div><a href="#"> Acceuil </a></div>
            <div><a href="#"> Nos Programme </a></div>
            <div><a href="#"> Contact </a></div>
            <div><a href="#"> Services </a></div>
            <button>
                Faire un don
            </button>
        </div>

    </div>
    <div class="overlay-bg none">

    </div>
    
</body>
</html>
